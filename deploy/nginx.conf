# Install as /etc/nginx/sites-available/englishai.technokiran.online
# Enable only after deploying the static files into the root directory.
server {
    listen 80;
    listen [::]:80;
    server_name englishai.technokiran.online;

    root /var/www/englishai.technokiran.online;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. {
        deny all;
    }
}
